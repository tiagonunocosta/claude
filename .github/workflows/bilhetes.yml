name: Bilhetes Portugal-Noruega

# Verifica a bilheteira oficial da FPF e abre (ou comenta) um issue quando os
# bilhetes parecem estar a venda. O issue faz o GitHub enviar-te email.
#
# Nota: o GitHub desativa workflows agendados em repositorios sem atividade
# durante 60 dias. Como o jogo e a 4 de outubro de 2026 e isto arranca em
# agosto, nao chega la -- mas se o repo ficar parado, reativa em Actions.

on:
  schedule:
    # 07:00, 12:00 e 18:00 UTC -> 08:00, 13:00 e 19:00 em Lisboa (WEST).
    - cron: "0 7,12,18 * * *"
  workflow_dispatch:
    inputs:
      forcar_alerta:
        description: "Abrir issue mesmo sem alerta (para testar a notificacao)"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: bilhetes
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # O estado guarda a impressao digital da pagina entre corridas, para
      # detetar mudancas que os sinais de texto nao reconhecam.
      - name: Restaurar estado da corrida anterior
        uses: actions/cache@v4
        with:
          path: .cache
          key: bilhetes-estado-${{ github.run_id }}
          restore-keys: |
            bilhetes-estado-

      - name: Verificar bilheteira
        id: verificar
        env:
          # Opcional: cria o secret NTFY_TOPICO em Settings > Secrets and
          # variables > Actions para receber push no telefone via ntfy.sh.
          # Sem o secret, esta variavel vem vazia e o script ignora-a.
          NTFY_TOPICO: ${{ secrets.NTFY_TOPICO }}
          BILHETES_WEBHOOK: ${{ secrets.BILHETES_WEBHOOK }}
        run: |
          set +e
          python3 scripts/check_bilhetes.py --json > relatorio.json
          codigo=$?
          set -e
          # Se o script morreu antes de escrever o relatorio, deixamos um
          # relatorio minimo para os passos seguintes nao falharem tambem.
          if ! python3 -c 'import json,sys; json.load(open("relatorio.json"))' 2>/dev/null; then
            printf '{"estado":"ERRO","explicacao":"o script nao produziu relatorio","evento":"?","verificado_em":"?","alerta":false,"resultados":[]}' > relatorio.json
            codigo=1
          fi
          estado=$(python3 -c 'import json;print(json.load(open("relatorio.json"))["estado"])')
          falhas=$(python3 -c 'import json;print(json.load(open("relatorio.json")).get("falhas_consecutivas",0))')
          echo "codigo=$codigo" >> "$GITHUB_OUTPUT"
          echo "estado=$estado" >> "$GITHUB_OUTPUT"
          echo "falhas=$falhas" >> "$GITHUB_OUTPUT"
          cat relatorio.json

      - name: Resumo
        if: always()
        run: |
          {
            echo "### Verificacao da bilheteira"
            echo
            echo "- **Estado:** \`${{ steps.verificar.outputs.estado }}\`"
            echo "- **Codigo de saida:** \`${{ steps.verificar.outputs.codigo }}\`"
            echo "- **Falhas consecutivas:** \`${{ steps.verificar.outputs.falhas }}\`"
            echo
            echo '```json'
            cat relatorio.json 2>/dev/null || echo '{}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorio-${{ github.run_id }}
          path: relatorio.json
          retention-days: 30

      - name: Avisar (abrir ou comentar issue)
        if: steps.verificar.outputs.codigo == '10' || steps.verificar.outputs.codigo == '2' || inputs.forcar_alerta
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const rel = JSON.parse(fs.readFileSync('relatorio.json', 'utf8'));
            const codigo = '${{ steps.verificar.outputs.codigo }}';

            const eProblema = codigo === '2';
            const titulo = eProblema
              ? 'Monitor de bilhetes precisa de ajuste'
              : 'Bilhetes Portugal-Noruega (04/10/2026)';
            const etiqueta = eProblema ? 'bilhetes-config' : 'bilhetes';
            const marcador = `<!-- bilhetes-monitor estado=${rel.estado} -->`;

            const corpoDetalhe = rel.resultados.map(r => {
              const rotulo = r.nome || r.url;
              const tipo = r.essencial === false ? ' _(notícias)_' : '';
              const linhas = [`- **${rotulo}**${tipo} -- \`${r.estado}\``];
              if (r.sinais_venda?.length) linhas.push(`  - sinais de venda: ${r.sinais_venda.join(', ')}`);
              if (r.sinais_bloqueio?.length) linhas.push(`  - sinais de bloqueio: ${r.sinais_bloqueio.join(', ')}`);
              if (r.preco_visivel) linhas.push('  - preco visivel na pagina');
              // Os tamanhos sao o que distingue uma app de JavaScript (HTML
              // grande, texto vazio) de uma pagina de desafio (ambos pequenos).
              if (r.tamanho_html !== undefined)
                linhas.push(`  - ${r.formato || '?'}: ${r.tamanho_html} bytes de HTML, ${r.tamanho_texto} caracteres de texto`);
              if (r.erro) linhas.push(`  - erro: ${r.erro}`);
              // Os titulos dizem se o feed trouxe noticias e o match falhou,
              // ou se simplesmente nao ha noticias.
              if (r.acertos?.length) {
                linhas.push('  - **noticias que casam com o evento E com venda:**');
                r.acertos.forEach(a => linhas.push(`    - ${a.titulo.slice(0, 160)}`));
              }
              if (r.titulos?.length) {
                linhas.push(`  - ${r.itens} noticias no feed (as primeiras):`);
                r.titulos.forEach(t => linhas.push(`    - ${t.slice(0, 140)}`));
              } else if (r.formato === 'feed') {
                linhas.push('  - o feed nao trouxe noticias nenhumas');
              }
              if (r.extrato) linhas.push(`  - extrato: \`${r.extrato.slice(0, 300).replace(/`/g, "'")}\``);
              return linhas.join('\n');
            }).join('\n');

            const porJavaScript = rel.resultados.some(r => r.estado === 'SEM_CONTEUDO');
            // Cegueira na bilheteira nao e cegueira total: se o feed de
            // noticias leu bem, ha ainda um canal vivo e o issue tem de o
            // dizer -- senao "monitor cego" le-se como "nada funciona".
            const noticiasVivas = rel.resultados.some(
              r => r.essencial === false && !['ERRO', 'SEM_CONTEUDO'].includes(r.estado));
            const causa = porJavaScript
              ? 'a pagina responde mas nao traz texto analisavel (conteudo carregado por JavaScript)'
              : `falharam ${rel.falhas_consecutivas} leituras seguidas (provavelmente a protecao anti-bot da Cloudflare a recusar o IP do runner)`;

            const fonteNoticia = rel.resultados.some(
              r => r.essencial === false && (r.estado === 'A_VENDA' || r.estado === 'ALTEROU'));
            const fonteBilheteira = rel.resultados.some(
              r => r.essencial !== false && (r.estado === 'A_VENDA' || r.estado === 'ALTEROU'));

            const cabecalho = eProblema
              ? [
                  '## O monitor esta cego',
                  '',
                  `A verificacao automatica **nao esta a conseguir ler a bilheteira**: ${causa}.`,
                  '',
                  '**Nao interpretes o silencio deste monitor como "os bilhetes ainda nao abriram".**',
                  'Enquanto isto nao for resolvido, ele nao deteta a abertura da venda.',
                  '',
                  'Como investigar, do teu computador (IP domestico passa onde o runner nao passa):',
                  '',
                  '```bash',
                  'python3 scripts/check_bilhetes.py --guardar-html /tmp/paginas',
                  '```',
                  '',
                  porJavaScript
                    ? 'Se o HTML guardado vier vazio, a correcao e apontar `--url` ao endpoint JSON que a pagina consome.'
                    : 'Se localmente funcionar, o problema e o IP do runner: passa o agendamento para cron local.',
                  '',
                  noticiasVivas
                    ? '> **O canal de noticias continua a funcionar.** Se a FPF anunciar a data de abertura na imprensa, este monitor ainda te avisa. O que se perdeu foi a leitura direta da bilheteira.'
                    : '> Nenhum canal esta a ler. Neste momento o monitor nao te avisa de nada.',
                ].join('\n')
              : [
                  `**${rel.explicacao}**`,
                  '',
                  fonteNoticia && !fonteBilheteira
                    ? 'O sinal vem das **noticias**, nao da bilheteira -- provavelmente foi anunciada uma data de abertura que ainda nao chegou ao site. Le o extrato abaixo e marca a data.'
                    : fonteNoticia && fonteBilheteira
                      ? 'Sinal na **bilheteira e nas noticias** -- a venda esta a abrir agora.'
                      : 'O sinal vem da **bilheteira oficial**.',
                  '',
                  'Confirma em https://bilheteira.fpf.pt/ e compra so em dominios `.fpf.pt`.',
                  'Se es socio Portugal+, usa o codigo promocional do email antes de finalizar.',
                ].join('\n');

            const corpo = [
              cabecalho,
              '',
              `**Evento:** ${rel.evento}`,
              `**Estado:** \`${rel.estado}\``,
              `**Verificado em:** ${rel.verificado_em}`,
              rel.falhas_consecutivas ? `**Leituras falhadas seguidas:** ${rel.falhas_consecutivas}` : '',
              rel.estado_restaurado === false ? '**Nota:** sem estado anterior nesta corrida (cache perdida) -- a detecao de mudanca fica inativa ate a proxima.' : '',
              '',
              '### Detalhe por pagina',
              corpoDetalhe,
              '',
              `[Corrida do workflow](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              '',
              marcador,
            ].join('\n');

            const abertos = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: etiqueta,
            });

            if (abertos.data.length === 0) {
              const criado = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: titulo,
                body: corpo,
                labels: [etiqueta],
              });
              core.notice(`Issue #${criado.data.number} criado (estado ${rel.estado}).`);
              return;
            }

            // Ja existe um issue aberto: comentar so quando o estado muda, para
            // nao encher a caixa de correio a cada corrida.
            const issue = abertos.data[0];
            const comentarios = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              per_page: 100,
            });
            const textos = [issue.body || '', ...comentarios.data.map(c => c.body || '')];
            const ultimoEstado = textos
              .map(t => t.match(/<!-- bilhetes-monitor estado=(\w+) -->/)?.[1])
              .filter(Boolean)
              .pop();

            if (ultimoEstado === rel.estado) {
              core.notice(`Issue #${issue.number} ja reporta o estado ${rel.estado}; sem novo comentario.`);
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: corpo,
            });
            core.notice(`Comentario adicionado ao issue #${issue.number} (${ultimoEstado} -> ${rel.estado}).`);
